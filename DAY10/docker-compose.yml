# Docker Compose - EFK + Vector + MCP Server + Nginx HTTPS
#
# 完全使用上课代码架构:
#   Router (syslog) → UDP :514 → Filebeat → (logstash:5044) → Vector → Elasticsearch
#   Agent (本地) → HTTPS :9443 → Nginx → HTTP :8765 → MCP Server → ES 查询
#   Kibana :5601 → Elasticsearch (日志可视化)
#
# 使用:
#   docker compose up --build -d
#   docker compose logs -f
#   docker compose down

services:
  # ============================================================
  # Elasticsearch - 日志存储引擎 (上课配置)
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.21
    container_name: day10-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - TZ=Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - efk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ============================================================
  # Kibana - 日志可视化 (上课配置)
  # ============================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.21
    container_name: day10-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - TZ=Asia/Shanghai
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - efk-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ============================================================
  # Vector - 日志处理管道 (上课代码)
  # ============================================================
  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: day10-vector
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      - VECTOR_LOG=info
    ports:
      - "5044:5044"
      - "9598:9598"
      - "8686:8686"
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - efk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8686/playground >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # ============================================================
  # Filebeat - Syslog 采集 (上课配置, 输出到 Vector)
  # ============================================================
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.21
    container_name: day10-filebeat
    user: root
    command: ["--strict.perms=false", "-e"]
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    ports:
      - "514:514/udp"
    depends_on:
      vector:
        condition: service_started
    networks:
      - efk-net
    restart: unless-stopped

  # ============================================================
  # ES Init - 初始化索引模板和 ILM 策略 (上课代码)
  # ============================================================
  es-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: day10-es-init
    working_dir: /work
    environment:
      - ES_URL=http://elasticsearch:9200
    volumes:
      - ./:/work
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["bash", "scripts/init-elasticsearch.sh"]
    networks:
      - efk-net
    restart: "no"

  # ============================================================
  # MCP Server - Elasticsearch 日志查询工具 (上课代码)
  # ============================================================
  mcp-server:
    build:
      context: ./mcp-es
      dockerfile: Dockerfile
    container_name: day10-mcp-server
    environment:
      - ES_URL=http://elasticsearch:9200
    ports:
      - "8765:8765"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - efk-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8765)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ============================================================
  # Nginx - HTTPS 反向代理 (TLS 加密)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: day10-nginx
    ports:
      - "9443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - mcp-server
    networks:
      - efk-net
    restart: unless-stopped

networks:
  efk-net:
    driver: bridge

volumes:
  es-data:
